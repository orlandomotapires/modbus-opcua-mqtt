# MQTT/TCP - apps mobile (mesma rede/hotspot) e Node-RED
listener 1883 0.0.0.0
protocol mqtt

# MQTT sobre WebSocket
listener 9001 0.0.0.0
protocol websockets

# Ambiente de laboratório: sem autenticação
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
