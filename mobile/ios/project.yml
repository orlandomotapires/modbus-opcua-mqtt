name: CalculadoraCLP
options:
  bundleIdPrefix: br.edu.modbusopcua
  deploymentTarget:
    iOS: "17.0"
packages:
  CocoaMQTT:
    url: https://github.com/emqx/CocoaMQTT
    from: 2.1.6
targets:
  CalculadoraCLP:
    type: application
    platform: iOS
    sources: [CalculadoraCLP]
    dependencies:
      - package: CocoaMQTT
    info:
      path: CalculadoraCLP/Info.plist
      properties:
        CFBundleDisplayName: Calculadora CLP
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSLocalNetworkUsageDescription: Conectar ao broker MQTT na rede local (hotspot) para enviar os números ao CLP.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: br.edu.modbusopcua.CalculadoraCLP
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
